<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <!-- Native Finder icons sit at (170, 266) and (510, 266). -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f0ff"/>
      <stop offset="1" stop-color="#f0faf9"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191a2d"/>
      <stop offset="1" stop-color="#0e2329"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#784cf5"/>
      <stop offset="1" stop-color="#25b9b0"/>
    </linearGradient>
  </defs>
  <rect width="680" height="440" fill="url(#canvas)"/>
  <rect x="24" y="24" width="632" height="122" rx="22" fill="url(#header)"/>
  <!-- The renderer places the existing PixelKit logo at (42, 42). -->
  <g font-family="Helvetica">
    <text x="98" y="72" font-size="28" font-weight="bold" fill="#f5f6fc">PixelKit</text>
    <text x="44" y="118" font-size="16" fill="#b9c6d4">Smaller files. Easier sharing.</text>
    <rect x="512" y="46" width="120" height="30" rx="15" fill="#183e40"/>
    <circle cx="530" cy="61" r="3" fill="#00cfbd"/>
    <text x="542" y="65" font-size="11" font-weight="bold" fill="#64e2d5">100% LOCAL</text>
    <text x="340" y="182" text-anchor="middle" font-size="18" font-weight="bold" fill="#29283c">Drag PixelKit to Applications</text>
    <rect x="76" y="204" width="188" height="156" rx="24" fill="#ffffff" fill-opacity="0.78" stroke="#ddd7f4"/>
    <rect x="416" y="204" width="188" height="156" rx="24" fill="#ffffff" fill-opacity="0.78" stroke="#cce7e3"/>
    <path d="M303 266 H377 M364 253 L377 266 L364 279" fill="none" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
