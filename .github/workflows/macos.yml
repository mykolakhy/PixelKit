name: macOS app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          brew install imagemagick ffmpeg
          python -m pip install -e '.[build]'
      - name: Check runtime, image processing and video compression
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build and verify standalone app and disk image
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/build_macos.py --version "${GITHUB_REF_NAME#v}"
          else
            python scripts/build_macos.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PixelKit-macOS-${{ matrix.arch }}
          path: dist/macos/${{ matrix.arch }}/*.dmg
          if-no-files-found: error
