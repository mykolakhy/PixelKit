name: macOS app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate tag against source version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_macos_release.py --tag "$RELEASE_TAG"
      - name: Install build dependencies
        run: |
          brew install imagemagick ffmpeg
          python -m pip install -e '.[build]'
      - name: Check runtime, image processing and video compression
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build and verify standalone app and disk image
        run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: PixelKit-macOS-${{ matrix.arch }}
          path: dist/macos/${{ matrix.arch }}/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: PixelKit-macOS-*
          merge-multiple: true
          path: dist/release
      - name: Publish both macOS disk images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_macos_release.py --tag "$RELEASE_TAG" --artifacts-dir dist/release --publish
